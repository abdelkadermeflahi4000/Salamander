# أضف هذه الأقسام إلى pyproject.toml الموجود (لا تستبدله)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # scikit-learn و mcp بلا stubs كاملة
warn_unused_ignores = true
