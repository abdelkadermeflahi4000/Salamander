[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "salamander"
version = "0.1.0"
description = "焰甲 Salamander — a universal trust envelope any AI agent can wear before touching untrusted content. Prompt-injection detection for English + Chinese."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Kader" }
]
keywords = ["ai-security", "prompt-injection", "llm-security", "agent-security", "mcp", "salamander"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/salamander"
